<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f4c5c">

  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حجز موعد عيادة - المنظومة الطبية</title>
<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --primary: #0f4c5c;
    --primary-hover: #0a3641;
    --accent-gold: #d97706;
    --accent-lime: #84cc16;
    --bg: #f8fafc;
    --text: #1e293b;
    --border: #cbd5e1;
    --success: #16a34a;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
  body {
    background: linear-gradient(rgba(15, 76, 92, 0.9), rgba(15, 76, 92, 0.9)), url('doctor.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: var(--text);
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .booking-container {
    background: white;
    padding: 30px;
    border-radius: 16px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 20px 35px rgba(0,0,0,0.25);
    border-top: 6px solid var(--accent-lime);
  }
  .clinic-header {
    text-align: center;
    margin-bottom: 25px;
  }
  .clinic-header h2 { color: var(--primary); font-size: 1.5rem; margin-bottom: 6px; }
  .clinic-header p { font-size: 0.9rem; color: #64748b; }
  
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field label { font-size: 0.88rem; font-weight: 700; color: #334155; }
  .field input, .field select, .field textarea {
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    outline: none;
    transition: 0.2s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(15, 76, 92, 0.1);
  }
  .btn-submit {
    background: var(--success);
    color: white;
    border: none;
    padding: 14px;
    width: 100%;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 10px;
  }
  .btn-submit:hover { background: #15803d; }
  
  .branch-info-box {
    background: #f1f5f9;
    padding: 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    color: #475569;
    margin-bottom: 16px;
    border-right: 4px solid var(--primary);
    display: none;
  }
  
  #successMessage {
    display: none;
    text-align: center;
    padding: 20px;
  }
  #successMessage h3 { color: var(--success); font-size: 1.4rem; margin-bottom: 10px; }
  #successMessage p { color: #475569; font-size: 0.95rem; line-height: 1.6; }
</style>
</head>
<body>

<div class="booking-container">
  
  <div id="bookingFormSection">
    <div class="clinic-header">
      <h2>🏥 حجز موعد بالعيادة</h2>
      <p>املأ البيانات أدناه وسيتواصل معك فريق العيادة لتأكيد الموعد</p>
    </div>

    <div class="field">
      <label>اختر فرع العيادة:</label>
      <select id="branchSelect" onchange="showBranchDetails()">
        <option value="">⏳ جاري تحميل العيادات والفروع...</option>
      </select>
    </div>

    <!-- كارت تفاصيل الفرع (العنوان والمواعيد) -->
    <div id="branchInfoBox" class="branch-info-box">
      📍 <span id="lblAddress">...</span><br>
      ⏰ <span id="lblHours">...</span><br>
      🗺️ <a id="lblMap" href="#" target="_blank" style="color:var(--primary); font-weight:bold; display:inline-block; margin-top:4px;">فتح اللوكيشن على خريطة جوجل ↗</a>
    </div>

    <div class="field">
      <label>📅 تاريخ الحجز المطلوب:</label>
      <input type="date" id="bookingDate">
    </div>

    <div class="field">
      <label>اسم المريض بالكامل (يجب إدخال الاسم الثلاثي على الأقل):</label>
      <input type="text" id="patientName" placeholder="مثال: أحمد محمد علي">
    </div>

    <div class="field">
      <label>رقم الهاتف الأساسي (يجب أن يكون عليه واتساب لإرسال التأكيد أو الإلغاء):</label>
      <input type="tel" id="patientPhone1" placeholder="01xxxxxxxxx">
    </div>

    <div class="field">
      <label>رقم هاتف إضافي (اختياري):</label>
      <input type="tel" id="patientPhone2" placeholder="01xxxxxxxxx">
    </div>

    <div class="field">
      <label>نوع الزيارة:</label>
      <select id="visitType">
        <option value="كشف جديد">كشف جديد</option>
        <option value="استشارة">استشارة / متابعة</option>
      </select>
    </div>

    <div class="field">
      <label>ملاحظات إضافية (اختياري):</label>
      <textarea id="patientNotes" rows="2" placeholder="اكتب أي تفاصيل أو أعراض..."></textarea>
    </div>

    <button class="btn-submit" onclick="submitOnlineBooking()">📅 إرسال طلب الحجز الآن</button>
  </div>

  <div id="successMessage">
    <h3>✅ تم إرسال طلبك بنجاح!</h3>
    <p>شكراً لك. طلب حجزك الآن في <b>قيد المراجعة</b> من قِبل طاقم العيادة، وسنرسل لك تفاصيل التأكيد أو الاعتذار عبر رقم الواتساب المسجل في أقرب وقت.</p>
    <button class="btn-submit" style="background: var(--primary); margin-top: 20px;" onclick="location.reload()">تسجيل حجز جديد</button>
  </div>

</div>

<script>
  const SUPABASE_URL = "https://gfheumheyrmyrczvlwdh.supabase.co";
  const SUPABASE_KEY = "sb_publishable_SFmYaaTF08Zt2gKPmk7UUw_siKQ_tDt";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let branchesData = [];

  window.onload = function() {
    document.getElementById('bookingDate').valueAsDate = new Date();
    loadBranchesForBooking();
  };

  async function loadBranchesForBooking() {
    let select = document.getElementById('branchSelect');
    const { data, error } = await supabaseClient.from('clinic_branches').select('*');
    
    if (!error && data && data.length > 0) {
      branchesData = data;
      select.innerHTML = '<option value="">-- اضغط لاختيار الفرع المناسب --</option>';
      data.forEach(b => {
        select.innerHTML += `<option value="${b.branch_name}">${b.branch_name}</option>`;
      });
    } else {
      select.innerHTML = '<option value="">⚠️ لا توجد فروع متاحة حالياً</option>';
    }
  }

  function showBranchDetails() {
    let selectedName = document.getElementById('branchSelect').value;
    let box = document.getElementById('branchInfoBox');
    
    if (!selectedName) {
      box.style.display = 'none';
      return;
    }

    let branch = branchesData.find(b => b.branch_name === selectedName);
    if (branch) {
      document.getElementById('lblAddress').innerText = branch.address || 'العنوان غير مدخل';
      document.getElementById('lblHours').innerText = `${branch.working_days || ''} (${branch.working_hours || ''})`;
      
      let mapA = document.getElementById('lblMap');
      if (branch.map_link) {
        mapA.href = branch.map_link;
        mapA.style.display = 'inline-block';
      } else {
        mapA.style.display = 'none';
      }
      box.style.display = 'block';
    }
  }

  async function submitOnlineBooking() {
    let branch_name = document.getElementById('branchSelect').value;
    let booking_date = document.getElementById('bookingDate').value;
    let patient_name = document.getElementById('patientName').value.trim();
    let phone1 = document.getElementById('patientPhone1').value.trim();
    let phone2 = document.getElementById('patientPhone2').value.trim();
    let visit_type = document.getElementById('visitType').value;
    let notes = document.getElementById('patientNotes').value.trim();

    if (!branch_name) return alert('⚠️ يرجى اختيار فرع العيادة.');
    if (!booking_date) return alert('⚠️ يرجى تحديد تاريخ الحجز.');
    if (!patient_name) return alert('⚠️ يرجى كتابة اسم المريض.');

    // التحقق البرمجي من أن الاسم ثلاثي على الأقل (3 كلمات)
    let nameParts = patient_name.split(/\s+/);
    if (nameParts.length < 3) {
      return alert('⚠️ عذراً، يجب إدخال الاسم ثلاثياً على الأقل (مثال: أحمد محمد علي).');
    }

    if (!phone1 || phone1.length < 10) return alert('⚠️ يرجى كتابة رقم هاتف واتساب أساسي صحيح للتواصل.');

    let fullPhones = phone1 + (phone2 ? ` / ${phone2}` : '');

    const { error } = await supabaseClient.from('patient_online_bookings').insert([{
      branch_name,
      booking_date,
      patient_name,
      phone: fullPhones,
      visit_type,
      notes,
      status: 'pending'
    }]);

    if (!error) {
      document.getElementById('bookingFormSection').style.display = 'none';
      document.getElementById('successMessage').style.display = 'block';
    } else {
      alert('⚠️ حدث خطأ أثناء إرسال الحجز، يرجى المحاولة مرة أخرى.');
    }
  }
</script>
</body>
</html>
